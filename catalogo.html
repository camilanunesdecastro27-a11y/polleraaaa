<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Completo | PULSEFIT</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <section class="section section-soft" style="padding-top: 40px;">
    <div class="container">
      <div style="position:relative; border-radius:22px; overflow:hidden; margin-bottom:35px; height:230px; box-shadow: var(--shadow-md);">
        <img src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1200&q=80" alt="Catálogo deportivo" style="width:100%; height:100%; object-fit:cover; filter:brightness(0.6);">
        <div style="position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; color:#fff; text-align:center; padding:20px;">
          <span class="badge-promo" style="margin-bottom:10px;">COLECCIÓN 2026</span>
          <h1 style="font-size:2.2rem; font-weight:800;">Catálogo General PULSEFIT</h1>
          <p>Filtra por marca, categoría o presupuesto desde $10 hasta $75</p>
        </div>
      </div>

      <div class="filter-bar">
        <select id="filter-category" class="filter-select" onchange="filterCatalog()">
          <option value="all">Todas las Categorías</option>
          <option value="zapatos damas">Zapatos Damas</option>
          <option value="zapatos caballeros">Zapatos Caballeros</option>
          <option value="zapatos niñas">Zapatos Niñas</option>
          <option value="zapatos niños">Zapatos Niños</option>
          <option value="botas">Botas</option>
          <option value="bolsos">Bolsos</option>
          <option value="remate deportivo">Remate Deportivo</option>
        </select>

        <select id="filter-brand" class="filter-select" onchange="filterCatalog()">
          <option value="all">Todas las Marcas</option>
          <option value="adidas">Adidas</option>
          <option value="alo">alo</option>
          <option value="shein">SHEIN</option>
          <option value="hero">HERO</option>
          <option value="fashion nova">Fashion Nova</option>
          <option value="nike">Nike</option>
        </select>

        <select id="filter-price" class="filter-select" onchange="filterCatalog()">
          <option value="all">Todos los Precios ($10 - $75)</option>
          <option value="10">Solo Remate $10</option>
          <option value="15">Solo Promos 2x$15</option>
          <option value="75">Hasta $75</option>
        </select>
      </div>

      <div class="products-grid" id="catalog-grid"></div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
